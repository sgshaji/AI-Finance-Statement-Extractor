# Name: File Upload Handler
# Catches file uploads (with no text) so the orchestrator processes them instead of falling through to Fallback.
kind: AdaptiveDialog
modelDescription: |-
  This topic handles situations where the user uploads or attaches a file (such as a PDF) without typing any accompanying text message. When the activity contains an attachment or the message text is just a filename (e.g., ending in .pdf, .xlsx, .docx), route to this topic. This ensures file-only uploads are processed by the Financial Statement Extractor action and then routed to HITL review.

beginDialog:
  kind: OnRecognizedIntent
  id: main
  intent:
    displayName: File Upload Handler
    triggerQueries:
      - I uploaded a file
      - Here is the file
      - Here's my document
      - Uploaded a PDF
      - Attached the report
      - Here is the PDF
      - "[file attached]"
      - Here's the financial report

  actions:
    - kind: SendActivity
      id: sendMessage_k7Rp3x
      activity: I received your file. Let me extract the financial statements...

    - kind: BeginDialog
      id: beginDialog_Rw4m7Q
      dialog: cree1_FinanceStatementAnalysisAgent.action.FinancialsExtractor-ExtractfinancialstatementsfromaPDFdoc
      input:
        kind: ActionInputBinding
        binding:
          fileContent: =First(System.Activity.Attachments).Content
          fileName: =First(System.Activity.Attachments).Name
      output:
        kind: ActionOutputBinding
        binding:
          balance_sheet: Topic.balance_sheet
          cash_flow: Topic.cash_flow
          income_statement: Topic.income_statement
          summary: Topic.summary
          company_name: Topic.company_name
          confidence: Topic.confidence
          job_id: Topic.job_id

    - kind: SendActivity
      id: sendMessage_summary
      activity: |-
        Extraction complete for **{Topic.company_name}**. Here is a summary:

        {Topic.summary}

        Launching the review wizard so you can inspect confidence levels before generating the Excel report...

    - kind: BeginDialog
      id: beginDialog_hitlRv
      dialog: cree1_FinanceStatementAnalysisAgent.topic.HITLReview
      input:
        kind: ActionInputBinding
        binding:
          balance_sheet: =Topic.balance_sheet
          income_statement: =Topic.income_statement
          cash_flow: =Topic.cash_flow
          summary: =Topic.summary
          company_name: =Topic.company_name
          confidence: =Topic.confidence
          job_id: =Topic.job_id
