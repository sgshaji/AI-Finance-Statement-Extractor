kind: AdaptiveDialog
modelDescription: HITL Review - shows confidence triage and lets analyst review or proceed to Excel generation.
beginDialog:
  kind: OnRedirect
  id: main
  actions:
    - kind: SendActivity
      id: sendMsg_summary
      activity: |-
        **Extraction Complete for {Global.company_name}**

        **Confidence Scores:**
        {Global.confidence}

    - kind: AdaptiveCardPrompt
      id: acPrompt_triage
      card:
        type: AdaptiveCard
        version: "1.5"
        body:
          - type: TextBlock
            text: What would you like to do?
            weight: Bolder
            size: Medium
          - type: TextBlock
            text: Review flagged items before generating Excel, or proceed directly.
            wrap: true
            isSubtle: true
        actions:
          - type: Action.Submit
            title: "\u2705 Proceed to Excel"
            style: positive
            data:
              action: proceed
          - type: Action.Submit
            title: "\uD83D\uDD0D Review & Edit"
            data:
              action: review
      output:
        binding:
          action: Topic.triage_action
      outputType:
        properties:
          action:
            displayName: User Action
            type: String

    - kind: ConditionGroup
      id: condGrp_triage
      conditions:
        - id: condItem_review
          condition: =Topic.triage_action = "review"
          actions:
            - kind: SendActivity
              id: sendMsg_reviewBs
              activity: |-
                **Balance Sheet:**
                {Global.balance_sheet}

            - kind: SendActivity
              id: sendMsg_reviewIs
              activity: |-
                **Income Statement:**
                {Global.income_statement}

            - kind: SendActivity
              id: sendMsg_reviewCf
              activity: |-
                **Cash Flow:**
                {Global.cash_flow}

            - kind: AdaptiveCardPrompt
              id: acPrompt_afterReview
              card:
                type: AdaptiveCard
                version: "1.5"
                body:
                  - type: TextBlock
                    text: Review complete. Ready to generate Excel?
                    weight: Bolder
                actions:
                  - type: Action.Submit
                    title: Generate Excel
                    style: positive
                    data:
                      action: proceed
              output:
                binding:
                  action: Topic.review_done
              outputType:
                properties:
                  action:
                    displayName: Action
                    type: String

    - kind: SendActivity
      id: sendMsg_generating
      activity: Generating your Excel report...

    - kind: BeginDialog
      id: beginDlg_excel
      input:
        binding:
          text: =Global.balance_sheet
          text_1: =Global.income_statement
          text_2: =Global.cash_flow
          text_3: =Global.summary
          text_4: =Global.company_name
      dialog: cree1_FinanceStatementAnalysisAgent.action.FinanceStatementProcessor
      output:
        binding:
          filename: Topic.filename
          fileurl: Topic.fileurl

    - kind: SendActivity
      id: sendMsg_done
      activity: "Your report is ready: **[{Topic.filename}]({Topic.fileurl})**"

inputType: {}
outputType: {}
