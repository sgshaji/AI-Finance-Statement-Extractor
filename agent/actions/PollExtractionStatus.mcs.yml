# Name: Poll Extraction Status
kind: TaskDialog
inputs:
  - kind: AutomaticTaskInput
    propertyName: jobId
    description: The job ID returned by the Submit Financial Statement Extraction action.

modelDisplayName: Poll extraction status
modelDescription: >-
  Checks the status of a financial statement extraction job. Returns the
  extracted data when complete, or status "processing" if still running.
outputs:
  - propertyName: status
    description: "Job status: processing, completed, or failed."

  - propertyName: company_name
    description: Company name (available when status is completed).

  - propertyName: summary
    description: Extraction summary JSON string (available when status is completed).

  - propertyName: balance_sheet
    description: Balance Sheet JSON string (available when status is completed).

  - propertyName: income_statement
    description: Income Statement JSON string (available when status is completed).

  - propertyName: cash_flow
    description: Cash Flow Statement JSON string (available when status is completed).

action:
  kind: InvokeConnectorTaskAction
  connectionReference: cree1_FinanceStatementAnalysisAgent.shared_financials-20extractor-5f60bfe6cc042375d2-5f547557861498fd2f.4854621a0b0a42ae811068346c539840
  connectionProperties:
    mode: Invoker
  operationId: getExtractionStatus

outputMode: All
