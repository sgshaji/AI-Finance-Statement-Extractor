# Name: Financials Extractor - Extract financial statements from a PDF document
kind: TaskDialog
inputs:
  - kind: AutomaticTaskInput
    propertyName: file
    description: The PDF file uploaded by the user. This is the file attachment from the conversation.

  - kind: AutomaticTaskInput
    propertyName: fileName
    description: The original file name of the PDF document uploaded by the user, including the file extension.

  # Enrichment mode: when true, the extractor performs additional AI-powered analysis
  # to fill gaps, normalize currency formats, and cross-validate figures across statements.
  # Hardcoded to true so all extractions include enriched, validated financial data.
  - kind: ManualTaskInput
    propertyName: enrichment
    value: "true"

modelDisplayName: Extract financial statements from a PDF document
modelDescription: >-
  Use this action when a user uploads a PDF containing a financial report, annual report, or financial statements
  and wants to extract or analyze the financial data within it. This action parses the uploaded PDF document and
  returns structured financial data broken down into four components: balance sheet, income statement, cash flow
  statement, and a financial summary. Call this action whenever the user asks to extract, parse, review, or analyze
  financial statements from an uploaded PDF file.
outputs:
  - propertyName: balance_sheet
    description: >-
      Structured balance sheet data extracted from the PDF, containing assets (current and non-current),
      liabilities (current and non-current), and shareholders' equity with line-item amounts and totals.
      Use this output to answer questions about the company's financial position, asset composition,
      debt levels, or net worth at a specific reporting date.

  - propertyName: cash_flow
    description: >-
      Structured cash flow statement data extracted from the PDF, broken down into operating activities,
      investing activities, and financing activities with line-item amounts and net cash movement.
      Use this output to answer questions about how the company generates and uses cash,
      free cash flow, capital expenditures, or dividend payments.

  - propertyName: income_statement
    description: >-
      Structured income statement (profit and loss) data extracted from the PDF, containing revenue,
      cost of goods sold, operating expenses, EBITDA, net profit, and earnings per share with line-item amounts.
      Use this output to answer questions about the company's revenue, profitability, margins,
      expense breakdown, or earnings performance over the reporting period.

  - propertyName: summary
    description: >-
      A high-level financial summary with key metrics and ratios derived from all three statements,
      including total revenue, net income, total assets, total liabilities, equity, and key financial ratios.
      Use this output to give the user a quick overview of the company's financial health
      or to compare headline figures without diving into full statement details.

  - propertyName: company_name
    description: The company name extracted from the financial report.

  - propertyName: confidence
    description: JSON confidence scores per statement with flagged rows

  - propertyName: job_id
    description: Unique job identifier for the extraction, used by the HITL review API endpoints

action:
  kind: InvokeConnectorTaskAction
  connectionReference: cree1_FinanceStatementAnalysisAgent.shared_financials-20extractor-5f60bfe6cc042375d2-5f547557861498fd2f.4854621a0b0a42ae811068346c539840
  connectionProperties:
    mode: Invoker

  operationId: extractFinancialStatements

outputMode: All