# Name: Parse Card Submission
# Description: Parses an Adaptive Card submit payload to extract the user action and corrections
kind: TaskDialog
inputs:
  - kind: AutomaticTaskInput
    propertyName: job_id
    description: The extraction job ID for the current review session.

  - kind: AutomaticTaskInput
    propertyName: statement_type
    description: The statement type being reviewed - "balance_sheet", "income_statement", or "cash_flow".

  - kind: AutomaticTaskInput
    propertyName: payload
    description: JSON string of the Adaptive Card submit payload from the analyst.

modelDisplayName: Parse card submission
modelDescription: >-
  Parses the Adaptive Card submit payload from the HITL review wizard to determine
  what action the analyst took (next, previous, submit, edit, start_review, skip_review)
  and extract any corrections they made to the financial statement data.
outputs:
  - propertyName: action
    description: The action taken by the analyst - "next", "previous", "submit", "edit", "start_review", or "skip_review".

  - propertyName: corrections
    description: JSON string of corrections diff from the analyst's edits.

action:
  kind: InvokeConnectorTaskAction
  connectionReference: cree1_FinanceStatementAnalysisAgent.shared_financials-20extractor-5f60bfe6cc042375d2-5f547557861498fd2f.4854621a0b0a42ae811068346c539840
  connectionProperties:
    mode: Invoker
  operationId: parseCardSubmission

outputMode: All
