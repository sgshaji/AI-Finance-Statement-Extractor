# Name: Submit Financial Statement Extraction
kind: TaskDialog
inputs:
  - kind: AutomaticTaskInput
    propertyName: file
    description: The PDF file uploaded by the user to extract financial statements from.

  - kind: AutomaticTaskInput
    propertyName: fileName
    description: The original file name of the uploaded PDF document.

  - kind: ManualTaskInput
    propertyName: enrichment
    value: "true"

modelDisplayName: Submit financial statement extraction
modelDescription: >-
  Uploads a PDF and starts financial statement extraction. Returns a jobId
  that must be polled using the Poll Extraction Status action to get results.
outputs:
  - propertyName: jobId
    description: The job ID to use when polling for extraction results.

  - propertyName: status
    description: The job status (will be "processing").

action:
  kind: InvokeConnectorTaskAction
  connectionReference: cree1_FinanceStatementAnalysisAgent.shared_financials-20extractor-5f60bfe6cc042375d2-5f547557861498fd2f.4854621a0b0a42ae811068346c539840
  connectionProperties:
    mode: Invoker
  operationId: submitExtraction

outputMode: All
